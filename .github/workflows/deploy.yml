name: Deploy Astro Site

on:
  push:
    branches:
      - main  # Ensure it only triggers on your main source branch

# THIS STOPS THE QUEUE PILE-UP: Automatically cancels older pending deployment runs
concurrency:
  group: pages-deployment
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          path: ./dist
